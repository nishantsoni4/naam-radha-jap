<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Radha Jap Counter</title>

<style>
    body { background:#ffe4ec; font-family:Arial; text-align:center; padding-top:40px; }
    .count { font-size:80px; font-weight:bold; margin:20px; }
    button { padding:15px 30px; margin:10px; font-size:20px;
             border:none; border-radius:10px; color:white; }
    .start{background:green;} .stop{background:orange;} .reset{background:red;}
</style>
</head>
<body>

<h1>💗 Radha Jap Counter 💗</h1>

<h2 id="lastWord">Last Word: —</h2>
<div class="count" id="count">0</div>

<button class="start" onclick="startListening()">Start Jap</button>
<button class="stop" onclick="stopListening()">Stop</button>
<button class="reset" onclick="resetCount()">Reset</button>

<script>
let count = 0;
let listening = false;
let recognition;

window.onload = () => {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Speech Recognition is not supported on this device.");
        return;
    }

    recognition = new webkitSpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.continuous = true;

    recognition.onresult = (event) => {
        let text = event.results[event.results.length - 1][0].transcript.toLowerCase();
        console.log("Heard:", text);

        if (text.includes("radha")) {
            count++;
            document.getElementById("count").innerText = count;
            document.getElementById("lastWord").innerText = "Last Word: Radha";
        }
    };

    recognition.onerror = (e) => {
        console.log("Error:", e.error);
    };
};

function startListening() {
    recognition.start();
    listening = true;
    console.log("Listening...");
}

function stopListening() {
    recognition.stop();
    listening = false;
}

function resetCount() {
    count = 0;
    document.getElementById("count").innerText = 0;
    document.getElementById("lastWord").innerText = "Last Word: —";
}
</script>

</body>
</html>
